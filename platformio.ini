; Ariya Monitor Mini
;   M5StickS3(BLE / Wi-Fi のアダプター)… 主な対象
;   M5Stack Core2(Bluetooth Classic / BLE / Wi-Fi)… おまけ
; 書き込み: pio run -e sticks3 -t upload(Core2 は -e core2)

[platformio]
default_envs = sticks3

[env]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
lib_deps =
  m5stack/M5GFX@0.2.36
  m5stack/M5Unified@0.2.29

[env:sticks3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

[env:core2]
board = m5stack-core2
board_build.partitions = huge_app.csv  ; Bluetooth Classic + BLE + Wi-Fi でプログラムが大きくなるため
